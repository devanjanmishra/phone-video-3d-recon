[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video2cad"
version = "0.1.0"
description = "Monocular home walkthrough video to metric 3D point cloud and rough CAD (DXF)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Devanjan Mishra" }]
keywords = [
    "3d-reconstruction", "monocular-depth", "point-cloud", "photogrammetry",
    "depth-anything", "cad", "dxf", "floor-plan", "computer-vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# torch + torchvision + xformers are NOT listed here because their wheels are
# CUDA-version specific. Install them first (see README), then `pip install -e .`.
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "open3d>=0.18",
    "ezdxf>=1.1",
    # DA3 runtime deps (vendored from Depth-Anything-3)
    "einops",
    "huggingface_hub",
    "imageio",
    "omegaconf",
    "pillow",
    "safetensors",
    "trimesh",
    "plyfile",
    "moviepy==1.0.3",
    "pillow_heif",
    "e3nn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/devanjanmishra/phone-video-3d-recon"
Repository = "https://github.com/devanjanmishra/phone-video-3d-recon"
Issues = "https://github.com/devanjanmishra/phone-video-3d-recon/issues"

[project.scripts]
video2cad = "video2cad.cli:main"

[tool.setuptools.packages.find]
include = ["video2cad*", "depth_anything_3*"]

[tool.ruff]
line-length = 100
target-version = "py310"
